name:                ai-accelerate
version:             0.1.0.0
github:              "githubuser/ai-accelerate"
license:             BSD-3-Clause
author:              "Author name here"
maintainer:          "example@example.com"
copyright:           "2026 Author name here"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/ai-accelerate#readme>

dependencies:
- base >= 4.7 && < 5

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src
  dependencies:
  - accelerate
  - matrix-accelerate >= 0.2
  - random
  - normaldistribution
  - bytestring
  - binary
  - data-binary-ieee754


tests:
  GdOptim:
    main:                Spec.hs
    source-dirs:         test/GdOptim
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - ai-accelerate
    - matrix-accelerate >= 0.2
    - accelerate
    - accelerate-llvm-ptx
    - random
    - deepseq

  GdOptim2:
    main:                Spec.hs
    source-dirs:         test/GdOptim2
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - ai-accelerate
    - matrix-accelerate >= 0.2
    - accelerate
    - accelerate-llvm-ptx
    - random
    - deepseq
    - normaldistribution

  MomOptim:
    main:                Spec.hs
    source-dirs:         test/MomOptim/
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - ai-accelerate
    - matrix-accelerate >= 0.2
    - accelerate
    - accelerate-llvm-ptx
    - random
    - deepseq
    - normaldistribution
    - list-shuffle

  RMSOptim:
    main:                Spec.hs
    source-dirs:         test/RMSOptim/
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - ai-accelerate
    - matrix-accelerate >= 0.2
    - accelerate
    - accelerate-llvm-ptx
    - random
    - megaparsec
    - megaparsec-csv

  AdamOptim:
    main:                Spec.hs
    source-dirs:         test/AdamOptim/
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - ai-accelerate
    - matrix-accelerate >= 0.2
    - accelerate
    - accelerate-llvm-ptx
    - accelerate-llvm-native
    - random
    - bytestring
    - text
    - deepseq
